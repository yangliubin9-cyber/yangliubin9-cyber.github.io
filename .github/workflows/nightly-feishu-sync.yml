name: Nightly Feishu Sync

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run nightly Feishu sync
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_TRANSLATION_MODEL: ${{ secrets.OPENAI_TRANSLATION_MODEL }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}
          FEISHU_BITABLE_ARTICLES_TABLE_ID: ${{ secrets.FEISHU_BITABLE_ARTICLES_TABLE_ID }}
          FEISHU_BITABLE_ARTICLES_VIEW_ID: ${{ secrets.FEISHU_BITABLE_ARTICLES_VIEW_ID }}
          FEISHU_DRIVE_ZH_FOLDER_TOKEN: ${{ secrets.FEISHU_DRIVE_ZH_FOLDER_TOKEN }}
          FEISHU_SYNC_TIMEOUT_MS: ${{ secrets.FEISHU_SYNC_TIMEOUT_MS }}
          FEISHU_SYNC_USE_RAW_CONTENT: ${{ secrets.FEISHU_SYNC_USE_RAW_CONTENT }}
        run: node ./scripts/feishu-sync.mjs --locale zh --translate-en

      - name: Commit synced content first
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/posts/zh src/content/posts/en
          if git diff --cached --quiet; then
            echo "No content changes to commit"
          else
            git commit -m "chore: nightly feishu sync [skip ci]"
            git push
          fi

      - name: Validate content and build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          npm run check
          npm run build
