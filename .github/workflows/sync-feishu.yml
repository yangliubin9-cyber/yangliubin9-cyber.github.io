name: Sync Feishu Posts

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FEISHU_OPEN_BASE_URL: ${{ secrets.FEISHU_OPEN_BASE_URL }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_USER_REFRESH_TOKEN: ${{ secrets.FEISHU_USER_REFRESH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Feishu secrets
        shell: bash
        run: |
          if [ -z "${FEISHU_APP_ID}" ] || [ -z "${FEISHU_APP_SECRET}" ]; then
            echo "::error::Missing FEISHU_APP_ID or FEISHU_APP_SECRET in GitHub Actions secrets."
            exit 1
          fi
          if [ -z "${FEISHU_USER_REFRESH_TOKEN}" ]; then
            echo "::error::Missing FEISHU_USER_REFRESH_TOKEN in GitHub Actions secrets. Personal Feishu folders require a user refresh token."
            exit 1
          fi

      - name: Sync Feishu posts
        shell: bash
        run: |
          set -o pipefail
          log_file="$(mktemp)"
          if npm run sync:feishu 2>&1 | tee "$log_file"; then
            exit 0
          fi
          if grep -q 'FEISHU_USER_REFRESH_TOKEN is invalid or expired' "$log_file"; then
            echo "::error::FEISHU_USER_REFRESH_TOKEN is invalid or expired. Run npm run auth:feishu locally, update GitHub Actions secret FEISHU_USER_REFRESH_TOKEN, then rerun Sync Feishu Posts."
          fi
          exit 1

      - name: Verify build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Commit synced content
        run: |
          if git diff --quiet; then
            echo "No synced content changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/posts
          git commit -m "Sync Feishu posts"
          git push
